[package]
name = "glsl2hlsl"
version = "0.1.0"
authors = ["Pema Malling <pemamalling@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
glsl = "7.0.0"

[workspace]
members=["glsl2hlsl-wasm"]

[profile.release]
# Tell `rustc` to optimize for small code size.
opt-level = "s"